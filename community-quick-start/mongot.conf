syncSource:
   replicaSet:
      hostAndPort: "mongod.search-community:27017"
      scramAuth:
        username: mongotUser
        passwordFile: /mongot-community/pwfile
        authSource: admin
        tls:
            enabled: true
            caFile: /mongot-community/tls/ca.pem
      readPreference: primaryPreferred
storage:
    dataPath: "/data/mongot"
server:
   grpc:
      address: "mongot.search-community:27028"
      tls:
         mode: "mTLS"
         certificateKeyFile: /mongot-community/tls/mongot-combined.pem
         caFile: /mongot-community/tls/ca.pem
metrics:
   enabled: true
   address: "mongot.search-community:9946"
healthCheck:
   address: "mongot.search-community:8080"
logging:
   verbosity: INFO
# Opt-in query tracing. Disabled by default: set enabled to true and restart mongot to
# export $search/$vectorSearch spans as OTLP-JSON through mongot logs. Only enablement
# and sampling are configurable; the export window and top-N use internal defaults.
# $search is tail-sampled (every query recorded); vector queries are head-sampled at 1%
# by default, so raise vectorTracingSamplerRate while diagnosing vector queries.
tracing:
   enabled: false
   searchSamplingStrategy: tail
   vectorSamplingStrategy: head
   searchTracingSamplerRate: 0.01
   vectorTracingSamplerRate: 0.01
